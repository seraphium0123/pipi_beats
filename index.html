<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮皮音樂台 Pipi Beats - 全曲目清單</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           CSS 負責樣式 (Standardized Styles)
           ========================================= */
        :root {
            /* 暗色主題 (預設) */
            --primary-gradient: linear-gradient(135deg, #9146ff 0%, #6441a5 100%);
            --twitch-purple: #9146ff;
            --success-green: #00f593;
            --bg-body: #0e0e10;
            --bg-container: #18181b;
            --bg-card: #232328;
            --bg-input: #1f1f23;
            --text-main: #f5f5f9;
            --text-secondary: #adadb8;
            --text-accent: #bf94ff;
            --border-style: 1px solid #303032;
            --tag-genre-bg: rgba(0, 245, 147, 0.1);
            --tag-genre-border: rgba(0, 245, 147, 0.3);
            --tag-genre-text: #00f593;
            
            /* BPM 標籤色彩 - 暗色主題 */
            --bpm-slow-bg: rgba(52, 152, 219, 0.15);
            --bpm-slow-text: #5dade2;
            --bpm-medium-bg: rgba(241, 196, 15, 0.15);
            --bpm-medium-text: #f4d03f;
            --bpm-fast-bg: rgba(231, 76, 60, 0.15);
            --bpm-fast-text: #ec7063;

            --modal-overlay: rgba(0, 0, 0, 0.75);
            --transition: all 0.2s ease;
        }

        /* 亮色主題切換 */
        :root.theme-light {
            --twitch-purple: #772ce8;
            --success-green: #008a52;
            --bg-body: #f0f0f4;
            --bg-container: #ffffff;
            --bg-card: #f9f9fb;
            --bg-input: #ffffff;
            --text-main: #18181b;
            --text-secondary: #53535f;
            --text-accent: #6441a5;
            --border-style: 1px solid #e5e5e5;
            --tag-genre-bg: rgba(0, 138, 82, 0.1);
            --tag-genre-border: rgba(0, 138, 82, 0.3);
            --tag-genre-text: #008a52;
            
            /* BPM 標籤色彩 - 亮色主題 */
            --bpm-slow-bg: rgba(41, 128, 185, 0.15);
            --bpm-slow-text: #2980b9;
            --bpm-medium-bg: rgba(212, 172, 13, 0.15);
            --bpm-medium-text: #d4ac0d;
            --bpm-fast-bg: rgba(192, 57, 43, 0.15);
            --bpm-fast-text: #c0392b;

            --modal-overlay: rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.5s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--bg-container);
            border: var(--border-style);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .theme-toggle-btn:hover {
            border-color: var(--twitch-purple);
            transform: scale(1.05);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .search-wrapper {
            position: sticky;
            top: 10px;
            z-index: 1000;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid var(--text-secondary);
            border-color: var(--border-style);
            background: var(--bg-input);
            color: var(--text-main);
            font-size: 1.1rem;
            transition: var(--transition);
        }
        
        #searchInput:focus {
            outline: none;
            border-color: var(--twitch-purple);
        }

        .song-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .song-item {
            background: var(--bg-container);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: var(--border-style);
            transition: var(--transition);
        }

        .song-item:hover {
            border-color: var(--twitch-purple);
            background: var(--bg-card);
        }

        .song-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            margin-right: 10px;
            cursor: pointer; 
        }

        .song-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .song-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .info-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-btn:hover {
            color: var(--twitch-purple);
            background: rgba(145, 70, 255, 0.1);
        }

        .song-artist {
            color: var(--text-main);
            font-size: 0.85rem;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .tag-group {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(145, 70, 255, 0.1);
            color: var(--text-accent);
            font-size: 0.7rem;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid rgba(145, 70, 255, 0.2);
        }

        /* 曲風標籤特殊樣式 */
        .genre-tag {
            background: var(--tag-genre-bg);
            color: var(--tag-genre-text);
            border-color: var(--tag-genre-border);
        }

        /* BPM 標籤特殊樣式 */
        .bpm-slow {
            background: var(--bpm-slow-bg);
            color: var(--bpm-slow-text);
            border-color: var(--bpm-slow-bg);
        }

        .bpm-medium {
            background: var(--bpm-medium-bg);
            color: var(--bpm-medium-text);
            border-color: var(--bpm-medium-bg);
        }

        .bpm-fast {
            background: var(--bpm-fast-bg);
            color: var(--bpm-fast-text);
            border-color: var(--bpm-fast-bg);
        }

        /* NEW 標籤特殊樣式 */
        .new-tag {
            background: linear-gradient(45deg, #ff4e4e, #ffaa00);
            color: #fff;
            border: none;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 2px 4px rgba(255, 78, 78, 0.3);
        }

        .copy-btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--twitch-purple);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: var(--twitch-purple);
            color: white;
        }

        .copy-btn.success {
            background: var(--success-green);
            border-color: var(--success-green);
            color: #000;
        }

        /* 共用彈出視窗樣式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-out;
            backdrop-filter: blur(2px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-container);
            border: var(--border-style);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: var(--border-style);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-accent);
        }

        .close-btn {
            color: var(--text-secondary);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .song-list { grid-template-columns: 1fr; }
            body { padding: 10px; }
            .theme-toggle-btn { top: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="channelTitle">皮皮音樂台 Pipi Beats</h1>
            <p class="subtitle">正在連線至曲目庫...</p>
            <button id="themeToggleBtn" class="theme-toggle-btn" title="切換深/淺色主題">🌞</button>
        </header>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜尋歌名、歌手、或分類標籤...">
        </div>

        <div id="songListContainer" class="song-list">
        </div>
    </div>

    <!-- 歌詞 Modal -->
    <div id="lyricsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">歌名</h2>
                <span class="close-btn" id="closeModalBtn">&times;</span>
            </div>
            <div id="lyricsBody" class="modal-body"></div>
        </div>
    </div>

    <!-- 介紹 Modal -->
    <div id="descModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="descModalTitle">曲目介紹</h2>
                <span class="close-btn" id="closeDescModalBtn">&times;</span>
            </div>
            <div id="descBody" class="modal-body"></div>
        </div>
    </div>

    <script>
        /* =========================================
           1. 配置抽離 (Config First)
           ========================================= */
        const DEFAULT_CONFIG = {
            channelName: "皮皮音樂台 Pipi Beats",
            requestPrefix: "!sr",
            dataSource: "songs.json",
            themePrefKey: "pipi_theme_preference", // 持久化主題的 Key
            bpmThresholds: {
                slow: 100, // 小於 100 視為慢板
                fast: 130  // 大於等於 130 視為快板，中間視為中板
            }
        };

        /* =========================================
           2. 狀態管理 (State Management)
           ========================================= */
        const RuntimeState = {
            allSongs: [],
            currentList: [],
            isDarkMode: true // 預設深色
        };

        /* =========================================
           3. 快取 DOM (DOM Cache)
           ========================================= */
        const DOM = {
            channelTitle: document.getElementById('channelTitle'),
            searchInput: document.getElementById('searchInput'),
            songListContainer: document.getElementById('songListContainer'),
            subtitle: document.querySelector('.subtitle'),
            themeToggleBtn: document.getElementById('themeToggleBtn'),
            
            // 歌詞 Modal 快取
            lyricsModal: document.getElementById('lyricsModal'),
            modalTitle: document.getElementById('modalTitle'),
            lyricsBody: document.getElementById('lyricsBody'),
            closeModalBtn: document.getElementById('closeModalBtn'),

            // 介紹 Modal 快取
            descModal: document.getElementById('descModal'),
            descModalTitle: document.getElementById('descModalTitle'),
            descBody: document.getElementById('descBody'),
            closeDescModalBtn: document.getElementById('closeDescModalBtn')
        };

        /* =========================================
           4. 模組化邏輯 (Logic Modules)
           ========================================= */

        const DataLoader = {
            /**
             * 從外部 JSON 讀取資料 (加強除錯版)
             */
            async load() {
                try {
                    // 加入快取消除隨機值，防止瀏覽器讀取舊檔案
                    const fetchUrl = `${DEFAULT_CONFIG.dataSource}?t=${new Date().getTime()}`;
                    const response = await fetch(fetchUrl);
                    
                    if (!response.ok) {
                        throw new Error(`[HTTP ${response.status}] 找不到 ${DEFAULT_CONFIG.dataSource} 檔案`);
                    }
                    
                    const data = await response.json();
                    RuntimeState.allSongs = data;
                    RuntimeState.currentList = data;
                    
                    RenderSystem.render(data);
                } catch (error) {
                    console.error("DataLoader Error:", error);
                    DOM.subtitle.textContent = "曲目讀取失敗";
                    DOM.songListContainer.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center; padding: 40px; color: #ff4e4e; background: var(--bg-card); border-radius: 8px;">
                            <h3 style="margin:0;">發生錯誤</h3>
                            <p style="color: var(--text-secondary); font-size: 0.9rem;">原因：${error.message}</p>
                            <button onclick="location.reload()" style="margin-top:10px; padding: 8px 16px; cursor:pointer;">重試</button>
                        </div>
                    `;
                }
            }
        };

        const RenderSystem = {
            init() {
                InteractionSystem.initTheme(); // 初始化主題
                DOM.channelTitle.textContent = DEFAULT_CONFIG.channelName;
                DataLoader.load();
            },

            createTags(song) {
                let tagsHtml = '';

                // 1. 優先處理 BPM (速度標籤)
                if (song.bpm) {
                    const bpmValue = parseInt(song.bpm, 10);
                    if (!isNaN(bpmValue)) {
                        let bpmClass = 'bpm-medium';
                        let bpmLabel = '中';
                        
                        if (bpmValue < DEFAULT_CONFIG.bpmThresholds.slow) {
                            bpmClass = 'bpm-slow';
                            bpmLabel = '慢';
                        } else if (bpmValue >= DEFAULT_CONFIG.bpmThresholds.fast) {
                            bpmClass = 'bpm-fast';
                            bpmLabel = '快';
                        }
                        
                        tagsHtml += `<span class="tag ${bpmClass}" title="BPM: ${song.bpm}">BPM ${song.bpm} (${bpmLabel})</span>`;
                    }
                }

                // 2. 處理 main_genre 與 sub_genre (顯示為專屬曲風標籤)
                if (song.main_genre) {
                    tagsHtml += `<span class="tag genre-tag">${song.main_genre}</span>`;
                }
                if (song.sub_genre) {
                    tagsHtml += `<span class="tag genre-tag">${song.sub_genre}</span>`;
                }

                // 3. 處理原有的 tags 陣列
                if (song.tags && song.tags.length > 0) {
                    song.tags.forEach(tag => {
                        // 若標籤為 NEW，套用特殊高光樣式
                        if (tag.toUpperCase() === 'NEW') {
                            tagsHtml += `<span class="tag new-tag">${tag}</span>`;
                        } else {
                            tagsHtml += `<span class="tag">${tag}</span>`;
                        }
                    });
                }

                if (!tagsHtml) return '';
                
                return `
                    <div class="tag-group">
                        ${tagsHtml}
                    </div>
                `;
            },

            render(list) {
                // 動態更新副標題的曲目數量
                DOM.subtitle.textContent = `共 ${list.length} 首曲目，點擊歌名看歌詞，點按鈕複製點歌！`;

                if (list.length === 0) {
                    DOM.songListContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 20px; color: var(--text-secondary);">無符合結果</div>`;
                    return;
                }

                DOM.songListContainer.innerHTML = list.map(song => `
                    <div class="song-item">
                        <div class="song-info" onclick="InteractionSystem.openLyrics('${song.id}')">
                            <div class="song-title-row">
                                <span class="song-title" title="${song.title}">${song.title}</span>
                                <button class="info-btn" title="查看曲目介紹" onclick="event.stopPropagation(); InteractionSystem.openDescription('${song.id}')">
                                    ℹ️
                                </button>
                            </div>
                            <span class="song-artist" title="${song.artist}">${song.artist}</span>
                            ${this.createTags(song)}
                        </div>
                        <button class="copy-btn" onclick="InteractionSystem.copy('${song.title}')">
                            !sr
                        </button>
                    </div>
                `).join('');
            }
        };

        const InteractionSystem = {
            // 主題初始化
            initTheme() {
                const savedTheme = localStorage.getItem(DEFAULT_CONFIG.themePrefKey);
                if (savedTheme === 'light') {
                    RuntimeState.isDarkMode = false;
                    document.documentElement.classList.add('theme-light');
                    DOM.themeToggleBtn.textContent = '🌙';
                } else {
                    RuntimeState.isDarkMode = true;
                    document.documentElement.classList.remove('theme-light');
                    DOM.themeToggleBtn.textContent = '🌞';
                }
            },

            // 切換深/淺色主題
            toggleTheme() {
                RuntimeState.isDarkMode = !RuntimeState.isDarkMode;
                if (RuntimeState.isDarkMode) {
                    document.documentElement.classList.remove('theme-light');
                    DOM.themeToggleBtn.textContent = '🌞';
                    localStorage.setItem(DEFAULT_CONFIG.themePrefKey, 'dark');
                } else {
                    document.documentElement.classList.add('theme-light');
                    DOM.themeToggleBtn.textContent = '🌙';
                    localStorage.setItem(DEFAULT_CONFIG.themePrefKey, 'light');
                }
            },

            handleSearch(e) {
                const term = e.target.value.toLowerCase().trim();
                RuntimeState.currentList = RuntimeState.allSongs.filter(song => {
                    const matchTitle = song.title.toLowerCase().includes(term);
                    const matchArtist = song.artist.toLowerCase().includes(term);
                    const matchTags = song.tags && song.tags.some(tag => tag.toLowerCase().includes(term));
                    const matchMainGenre = song.main_genre && song.main_genre.toLowerCase().includes(term);
                    const matchSubGenre = song.sub_genre && song.sub_genre.toLowerCase().includes(term);
                    const matchBpm = song.bpm && song.bpm.toString().includes(term);
                    
                    return matchTitle || matchArtist || matchTags || matchMainGenre || matchSubGenre || matchBpm;
                });
                RenderSystem.render(RuntimeState.currentList);
            },

            copy(title) {
                const command = `${DEFAULT_CONFIG.requestPrefix} ${title}`;
                navigator.clipboard.writeText(command).then(() => {
                    const btn = event.target;
                    const oldText = btn.innerText;
                    btn.innerText = "OK!";
                    btn.classList.add('success');
                    setTimeout(() => {
                        btn.innerText = oldText;
                        btn.classList.remove('success');
                    }, 1000);
                });
            },

            // 歌詞 Modal 邏輯
            openLyrics(id) {
                const song = RuntimeState.allSongs.find(s => s.id === id);
                if (!song) return;
                
                DOM.modalTitle.textContent = song.title;
                
                let formattedLyrics = "暫無歌詞提供";
                if (song.lyrics && song.lyrics.length > 0) {
                    // 將陣列合併，並使用正規表達式移除時間軸 (如 [00:13.71]) 讓閱讀更乾淨
                    formattedLyrics = song.lyrics.map(line => line.replace(/\[\d{2}:\d{2}\.\d{2}\]/g, '').trim()).join('\n');
                }
                
                DOM.lyricsBody.textContent = formattedLyrics;
                DOM.lyricsModal.classList.add('active');
            },

            closeLyrics() {
                DOM.lyricsModal.classList.remove('active');
            },

            // 介紹 Modal 邏輯
            openDescription(id) {
                const song = RuntimeState.allSongs.find(s => s.id === id);
                if (!song) return;
                
                DOM.descModalTitle.textContent = `[介紹] ${song.title}`;
                DOM.descBody.textContent = song.description || "這首曲目暫無詳細介紹。";
                DOM.descModal.classList.add('active');
            },

            closeDescription() {
                DOM.descModal.classList.remove('active');
            }
        };

        /* =========================================
           5. 初始化監聽 (Initialize)
           ========================================= */
        
        // 主題切換監聽
        DOM.themeToggleBtn.addEventListener('click', () => InteractionSystem.toggleTheme());

        // 搜尋監聽
        DOM.searchInput.addEventListener('input', (e) => InteractionSystem.handleSearch(e));
        
        // 歌詞 Modal 監聽
        DOM.closeModalBtn.addEventListener('click', () => InteractionSystem.closeLyrics());
        DOM.lyricsModal.addEventListener('click', (e) => {
            if (e.target === DOM.lyricsModal) InteractionSystem.closeLyrics();
        });

        // 介紹 Modal 監聽
        DOM.closeDescModalBtn.addEventListener('click', () => InteractionSystem.closeDescription());
        DOM.descModal.addEventListener('click', (e) => {
            if (e.target === DOM.descModal) InteractionSystem.closeDescription();
        });

        // 啟動系統
        RenderSystem.init();

    </script>
</body>
</html>
