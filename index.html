<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皮皮音樂台 Pipi Beats - 全曲目清單</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           CSS 負責樣式 (Standardized Styles)
           ========================================= */
        :root {
            --primary-gradient: linear-gradient(135deg, #9146ff 0%, #6441a5 100%);
            --twitch-purple: #9146ff;
            --success-green: #00f593;
            --bg-body: #0e0e10;
            --bg-container: #18181b;
            --bg-card: #232328;
            --bg-input: #1f1f23;
            --text-main: #f5f5f9;
            --text-secondary: #adadb8;
            --text-accent: #bf94ff;
            --border-style: 1px solid #303032;
            --transition: all 0.2s ease;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .search-wrapper {
            position: sticky;
            top: 10px;
            z-index: 1000;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid #303032;
            background: var(--bg-input);
            color: var(--text-main);
            font-size: 1.1rem;
            transition: var(--transition);
        }

        .song-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .song-item {
            background: var(--bg-container);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: var(--border-style);
            transition: var(--transition);
        }

        .song-item:hover {
            border-color: var(--twitch-purple);
            background: var(--bg-card);
        }

        .song-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            margin-right: 10px;
            cursor: pointer; /* 新增游標樣式提示可點擊 */
        }

        .song-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            color: var(--text-main);
            font-size: 0.85rem;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tag-group {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(145, 70, 255, 0.1);
            color: var(--text-accent);
            font-size: 0.7rem;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid rgba(145, 70, 255, 0.2);
        }

        .copy-btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--twitch-purple);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: var(--twitch-purple);
            color: white;
        }

        .copy-btn.success {
            background: var(--success-green);
            border-color: var(--success-green);
            color: #000;
        }

        /* 歌詞彈出視窗樣式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-out;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-container);
            border: var(--border-style);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: var(--border-style);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-accent);
        }

        .close-btn {
            color: var(--text-secondary);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .lyrics-body {
            padding: 20px;
            overflow-y: auto;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .song-list { grid-template-columns: 1fr; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="channelTitle">皮皮音樂台 Pipi Beats</h1>
            <p class="subtitle">正在連線至曲目庫...</p>
        </header>

        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜尋歌名、歌手、或分類標籤...">
        </div>

        <div id="songListContainer" class="song-list">
        </div>
    </div>

    <div id="lyricsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">歌名</h2>
                <span class="close-btn" id="closeModalBtn">&times;</span>
            </div>
            <div id="lyricsBody" class="lyrics-body"></div>
        </div>
    </div>

    <script>
        /* =========================================
           1. 配置抽離 (Config First)
           ========================================= */
        const DEFAULT_CONFIG = {
            channelName: "皮皮音樂台 Pipi Beats",
            requestPrefix: "!sr",
            dataSource: "songs.json" 
        };

        /* =========================================
           2. 狀態管理 (State Management)
           ========================================= */
        const RuntimeState = {
            allSongs: [],
            currentList: []
        };

        /* =========================================
           3. 快取 DOM (DOM Cache)
           ========================================= */
        const DOM = {
            channelTitle: document.getElementById('channelTitle'),
            searchInput: document.getElementById('searchInput'),
            songListContainer: document.getElementById('songListContainer'),
            subtitle: document.querySelector('.subtitle'),
            // Modal 快取
            lyricsModal: document.getElementById('lyricsModal'),
            modalTitle: document.getElementById('modalTitle'),
            lyricsBody: document.getElementById('lyricsBody'),
            closeModalBtn: document.getElementById('closeModalBtn')
        };

        /* =========================================
           4. 模組化邏輯 (Logic Modules)
           ========================================= */

        const DataLoader = {
            /**
             * 從外部 JSON 讀取資料 (加強除錯版)
             */
            async load() {
                try {
                    // 加入快取消除隨機值，防止瀏覽器讀取舊檔案
                    const fetchUrl = `${DEFAULT_CONFIG.dataSource}?t=${new Date().getTime()}`;
                    const response = await fetch(fetchUrl);
                    
                    if (!response.ok) {
                        throw new Error(`[HTTP ${response.status}] 找不到 ${DEFAULT_CONFIG.dataSource} 檔案`);
                    }
                    
                    const data = await response.json();
                    RuntimeState.allSongs = data;
                    RuntimeState.currentList = data;
                    
                    DOM.subtitle.textContent = `共 ${data.length} 首曲目，點擊歌名看歌詞，點按鈕複製點歌！`;
                    RenderSystem.render(data);
                } catch (error) {
                    console.error("DataLoader Error:", error);
                    DOM.subtitle.textContent = "曲目讀取失敗";
                    DOM.songListContainer.innerHTML = `
                        <div style="grid-column: 1/-1; text-align:center; padding: 40px; color: #ff4e4e; background: #1f1f23; border-radius: 8px;">
                            <h3 style="margin:0;">發生錯誤</h3>
                            <p style="color: #adadb8; font-size: 0.9rem;">原因：${error.message}</p>
                            <button onclick="location.reload()" style="margin-top:10px; padding: 8px 16px; cursor:pointer;">重試</button>
                        </div>
                    `;
                }
            }
        };

        const RenderSystem = {
            init() {
                DOM.channelTitle.textContent = DEFAULT_CONFIG.channelName;
                DataLoader.load();
            },

            createTags(tags) {
                if (!tags || tags.length === 0) return '';
                return `
                    <div class="tag-group">
                        ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                `;
            },

            render(list) {
                if (list.length === 0) {
                    DOM.songListContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 20px; color: var(--text-secondary);">無符合結果</div>`;
                    return;
                }

                DOM.songListContainer.innerHTML = list.map(song => `
                    <div class="song-item">
                        <div class="song-info" onclick="InteractionSystem.openLyrics('${song.id}')">
                            <span class="song-title" title="${song.title}">${song.title}</span>
                            <span class="song-artist" title="${song.artist}">${song.artist}</span>
                            ${this.createTags(song.tags)}
                        </div>
                        <button class="copy-btn" onclick="InteractionSystem.copy('${song.title}')">
                            !sr
                        </button>
                    </div>
                `).join('');
            }
        };

        const InteractionSystem = {
            handleSearch(e) {
                const term = e.target.value.toLowerCase().trim();
                RuntimeState.currentList = RuntimeState.allSongs.filter(song => {
                    return song.title.toLowerCase().includes(term) || 
                           song.artist.toLowerCase().includes(term) ||
                           (song.tags && song.tags.some(tag => tag.toLowerCase().includes(term)));
                });
                RenderSystem.render(RuntimeState.currentList);
            },

            copy(title) {
                const command = `${DEFAULT_CONFIG.requestPrefix} ${title}`;
                navigator.clipboard.writeText(command).then(() => {
                    const btn = event.target;
                    const oldText = btn.innerText;
                    btn.innerText = "OK!";
                    btn.classList.add('success');
                    setTimeout(() => {
                        btn.innerText = oldText;
                        btn.classList.remove('success');
                    }, 1000);
                });
            },

            openLyrics(id) {
                const song = RuntimeState.allSongs.find(s => s.id === id);
                if (!song) return;
                
                DOM.modalTitle.textContent = song.title;
                
                let formattedLyrics = "暫無歌詞提供";
                if (song.lyrics && song.lyrics.length > 0) {
                    // 將陣列合併，並使用正規表達式移除時間軸 (如 [00:13.71]) 讓閱讀更乾淨
                    formattedLyrics = song.lyrics.map(line => line.replace(/\[\d{2}:\d{2}\.\d{2}\]/g, '').trim()).join('\n');
                }
                
                DOM.lyricsBody.textContent = formattedLyrics;
                DOM.lyricsModal.classList.add('active');
            },

            closeLyrics() {
                DOM.lyricsModal.classList.remove('active');
            }
        };

        /* =========================================
           5. 初始化監聽 (Initialize)
           ========================================= */
        DOM.searchInput.addEventListener('input', (e) => InteractionSystem.handleSearch(e));
        
        // 點擊右上角 X 關閉歌詞
        DOM.closeModalBtn.addEventListener('click', () => InteractionSystem.closeLyrics());
        
        // 點擊 Modal 外部半透明背景關閉歌詞
        DOM.lyricsModal.addEventListener('click', (e) => {
            if (e.target === DOM.lyricsModal) {
                InteractionSystem.closeLyrics();
            }
        });

        RenderSystem.init();

    </script>
</body>
</html>
